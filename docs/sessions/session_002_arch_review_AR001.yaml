# ─────────────────────────────────────────────────────────────────────────────
# OSS AGENT CROSS-REFERENCE (TB-001 Chronos-2, TB-004 NeuralForecast)
# ─────────────────────────────────────────────────────────────────────────────

oss_cross_reference:

  chronos2_compatibility:
    verdict: compatible
    dual_pipeline_decision: approved
    notes:
      - "Chronos-2 accepts (id, timestamp, target) + covariate columns"
      - "Quarterly frequency (QE) is supported natively"
      - "V-039 (10Y rate), V-040 (fed funds), V-041 (VIX) map directly to known_covariates"
      - "V-009 (RNOA), V-015 (ln_assets) map to past/static covariates"
    pipeline_1:
      target: "V-001 — dividend_per_share_ttm (DVD_SH_12M)"
      covariates_known: [V-039, V-040, V-041, V-042]
      covariates_past: [V-009, V-010, V-011, V-014, V-015, V-017, V-023]
      rationale: >
        Dividend series is more stationary and aligns with Chronos-2
        pretraining distribution. Fundamental covariates capture payout
        capacity. Macro covariates passed as known-future inputs.
        Output: forecasted DPS trajectory → used to construct expected
        forward yield and dividend growth rate for scoring.
      notebook: notebooks/03a_model_chronos_dividend_series.ipynb

    pipeline_2:
      target: "V-032 — total_return_index (TOT_RETURN_INDEX_GROSS_DVDS)"
      covariates_known: [V-039, V-040, V-041, V-042]
      covariates_past: [V-009, V-010, V-011, V-014, V-015, V-017, V-023]
      rationale: >
        Direct total return forecast. More volatile series — may require
        fine-tuning on Bloomberg panel to outperform zero-shot baseline.
        Compared against pipeline 1 composite to validate which is a
        better predictor of realized returns.
      notebook: notebooks/03b_model_chronos_total_return.ipynb

    comparison_design: >
      Both pipelines run in parallel on the same walk-forward splits.
      Evaluation metric: out-of-sample CRPS and WQL on held-out quarters.
      Pipeline 1 output (forecasted DPS) is converted to an implied total
      return estimate using current price and historical yield-price relationship.
      The two implied return estimates are then compared against realized
      total return (V-032 lagged +4Q) to determine which pipeline produces
      more accurate forward return predictions. The better-performing pipeline
      feeds the composite scoring model.

  neuralforecast_compatibility:
    verdict: compatible
    notes:
      - "NeuralForecast TFT supports static covariates: GICS sector (V-043),
         foreign_incorporated flag (V-045), is_reit, is_utility, market_cap_class"
      - "NeuralForecast TFT supports time-varying known: macro variables V-039-V-042"
      - "NeuralForecast TFT supports time-varying unknown: all fundamental features"
      - "Panel structure (unique_id=ticker, ds=quarter_end, y=target) is correct"
      - "Universe: 76 US tickers × 72 quarters (2008-2026) = 5,472 obs.
         72 quarters per ticker is borderline for TFT — empirical validation required.
         Cross-sectional pooling across 76 tickers is the primary mitigation."
    flag: >
      SHORT SERIES RISK: 72 quarters per ticker is at the lower bound for
      NeuralForecast TFT. Mitigations: (1) Train jointly across all 76 tickers
      (cross-sectional pooling). (2) Use simpler NF models (NHITS, NBEATS)
      as fallback if TFT underperforms. Assess empirically.

