  - id: TD-001
    description: >
      Analyst estimate vintage pull (V-035, V-036) requires Bloomberg BDH
      override parameters. Not yet implemented. If pulled without override,
      all analyst estimate features will contain look-ahead bias.
    introduced_at: "session_002 — pre-pull variable spec"
    priority: high
    resolution_plan: >
      Coding agent implements BDH override in src/bloomberg/pull.py before
      analyst estimate fields are pulled. Architecture agent validates
      with test pull on 1 ticker (JPM) comparing override vs non-override
      to confirm vintage behavior.

  - id: TD-002
    description: >
      Non-US ticker filing lag variability not yet characterized per ticker.
      Using a uniform 60-day lag is conservative but may drop valid data
      for faster-filing US companies.
    introduced_at: "session_002 — pre-pull variable spec"
    priority: medium
    resolution_plan: >
      After Bloomberg pull, compare FILING_STATUS or EQY_FILING_DATE
      field per ticker to calibrate ticker-specific lags. Refine feature
      construction window in v2 of panel build.

  - id: TD-003
    description: >
      Dual Chronos-2 pipeline architecture — two separate pipelines approved
      by researcher: (1) dividend series target, (2) total return target.
      Both run on same walk-forward splits. Better-performing pipeline feeds
      composite scoring model.
    introduced_at: "session_002 — OSS cross-reference"
    priority: resolved
    resolution: >
      Researcher approved dual pipeline on 2026-03-28. Pipeline 1 target:
      V-001 (DVD_SH_12M). Pipeline 2 target: V-032 (TOT_RETURN_INDEX_GROSS_DVDS).
      Notebooks: 03a (dividend series) and 03b (total return).
      Comparison design documented in OSS cross-reference section above.

  - id: TD-004
    description: >
      Beta divergence feature (beta_5y - beta_1y) suggested but not yet
      in variable spec. May be more informative than either raw beta.
    introduced_at: "session_002 — redundancy check"
    priority: low
    resolution_plan: >
      Add as FE-XXX derived feature after initial Bloomberg pull confirms
      both beta fields available. Test whether divergence adds predictive
      power beyond individual beta values.
